<svg xmlns="http://www.w3.org/2000/svg" width="980" height="685" viewBox="0 0 980 685" role="img" aria-label="上传红色地块边界、自动识别、生成成果包示意图">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#3f7ceb"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="zipfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f0ff"/>
    </linearGradient>
    <linearGradient id="folderfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#f5b73c"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#dfe9f8" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif; }
      .headline { font-size: 24px; font-weight: 700; fill: #17293a; }
      .step { font-size: 19px; font-weight: 700; fill: #17293a; }
      .stepnum { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .formats { font-size: 14.5px; font-weight: 600; fill: #43566d; }
      .mid { font-size: 16px; font-weight: 700; fill: #3f7ceb; }
      .midnote { font-size: 13.5px; fill: #66788d; }
      .file { font-size: 14px; font-weight: 600; fill: #23384f; }
      .file .ext { font-weight: 700; fill: #17293a; }
      .caption { font-size: 15px; font-weight: 700; fill: #23384f; }
      .footnote { font-size: 14px; fill: #66788d; }
    </style>
  </defs>

  <text class="headline" x="40" y="56">一份边界文件，变成可提交的成果包</text>

  <!-- ① 上传（1:1 宽） -->
  <g filter="url(#soft)">
    <rect x="40" y="96" width="410" height="500" rx="18" fill="#ffffff" stroke="#e4eaf3"/>
  </g>
  <circle cx="76" cy="136" r="15" fill="url(#accent)"/>
  <text class="stepnum" x="76" y="141" text-anchor="middle">1</text>
  <text class="step" x="104" y="143">上传</text>

  <g filter="url(#softer)">
    <rect x="64" y="184" width="362" height="236" rx="16" fill="url(#map)" stroke="#c7dcfd" stroke-dasharray="9 8"/>
  </g>
  <rect x="66" y="186" width="358" height="232" rx="15" fill="url(#grid)" opacity="0.75"/>

  <!-- 红色地块边界 -->
  <g>
    <path d="M150 250l74-22 84 30 30 62-46 52-92-6-58-50z"
          fill="#ff6a5e" fill-opacity="0.10" stroke="#ff6a5e" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- 每个顶点的“拐点符号”：白底红框圆角方块，中心与顶点严格对齐 -->
    <g fill="#ffffff" stroke="#ff6a5e" stroke-width="2.5">
      <rect x="144" y="244" width="12" height="12" rx="3"/>
      <rect x="218" y="222" width="12" height="12" rx="3"/>
      <rect x="302" y="252" width="12" height="12" rx="3"/>
      <rect x="332" y="314" width="12" height="12" rx="3"/>
      <rect x="286" y="366" width="12" height="12" rx="3"/>
      <rect x="194" y="360" width="12" height="12" rx="3"/>
      <rect x="136" y="310" width="12" height="12" rx="3"/>
    </g>
    <text class="midnote" x="236" y="392" text-anchor="middle" font-size="13">上传的地块边界</text>
  </g>

  <text class="midnote" x="245" y="454" text-anchor="middle">整套上传即可</text>
  <text class="formats" x="245" y="492" text-anchor="middle">Shapefile · dxf · kml · kmz</text>
  <text class="formats" x="245" y="522" text-anchor="middle">xlsx · xls · csv · txt</text>

  <!-- 中间：自动识别 -->
  <path d="M460 348h44" stroke="#d3e0f2" stroke-width="5" stroke-linecap="round"/>
  <path d="M494 336l16 12-16 12" fill="none" stroke="#5296ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mid" x="490" y="404" text-anchor="middle">自动识别</text>
  <text class="midnote" x="490" y="428" text-anchor="middle">坐标 · 面积</text>
  <text class="midnote" x="490" y="448" text-anchor="middle">行政区</text>

  <!-- ② 成果包（1:1 宽） -->
  <g filter="url(#soft)">
    <rect x="530" y="96" width="410" height="500" rx="18" fill="#ffffff" stroke="#e4eaf3"/>
  </g>
  <circle cx="566" cy="136" r="15" fill="url(#accent)"/>
  <text class="stepnum" x="566" y="141" text-anchor="middle">2</text>
  <text class="step" x="594" y="143">成果包</text>

  <!-- 上方两个图标：水平一行（ZIP → 文件夹），文字放在下方 -->
  <g filter="url(#softer)">
    <path d="M650 190h40l12 14v58a7 7 0 0 1-7 7h-45a7 7 0 0 1-7-7v-65a7 7 0 0 1 7-7z" fill="url(#zipfill)" stroke="#9dc0ff" stroke-width="3"/>
  </g>
  <g stroke="#3f7ceb" stroke-width="3" stroke-linecap="round">
    <path d="M670 198h8M670 210h8M670 222h8M670 234h8"/>
  </g>

  <path d="M714 220h16" stroke="#d3e0f2" stroke-width="4" stroke-linecap="round"/>
  <path d="M722 212l10 8-10 8" fill="none" stroke="#5296ff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#softer)">
    <path d="M744 202h34l10 12h36a7 7 0 0 1 7 7v38a7 7 0 0 1-7 7h-80a7 7 0 0 1-7-7v-50a7 7 0 0 1 7-7z" fill="url(#folderfill)" stroke="#e2a326" stroke-width="2"/>
  </g>

  <text class="caption" x="735" y="292" text-anchor="middle">初步调查1101183830033<tspan fill="#3f7ceb">.zip</tspan></text>
  <text class="midnote" x="735" y="314" text-anchor="middle" font-size="13">解压后：初步调查1101183830033 /</text>

  <path d="M554 338h362" stroke="#e8eef7" stroke-width="2"/>

  <!-- 文件夹里的文件清单（示例地块编号来自示例数据），整块水平居中 -->
  <g>
    <g fill="none" stroke="#9dc0ff" stroke-width="2">
      <rect x="613" y="356" width="16" height="20" rx="4"/>
      <rect x="613" y="386" width="16" height="20" rx="4"/>
      <rect x="613" y="416" width="16" height="20" rx="4"/>
      <rect x="613" y="446" width="16" height="20" rx="4"/>
      <rect x="613" y="476" width="16" height="20" rx="4"/>
    </g>
    <text class="file" x="638" y="372">初步调查1101183830033<tspan class="ext">.shp</tspan></text>
    <text class="file" x="638" y="402">初步调查1101183830033<tspan class="ext">.shx</tspan></text>
    <text class="file" x="638" y="432">初步调查1101183830033<tspan class="ext">.dbf</tspan></text>
    <text class="file" x="638" y="462">初步调查1101183830033<tspan class="ext">.prj</tspan></text>
    <text class="file" x="638" y="492">初步调查1101183830033<tspan class="ext">.cpg</tspan></text>
  </g>

  <text class="footnote" x="490" y="648" text-anchor="middle">字段与命名按提交要求自动整理；另有 .shp.xml 字段说明与 .jpg 成果图（可选）</text>
</svg>
